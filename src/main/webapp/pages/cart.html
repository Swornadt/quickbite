<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/cart.css">
<title>Home | QuickBite</title>
</head>

<body>
<!-- Header -->

<!-- Main container -->
<div class="container">

    <!-- Left Cart items List -->
    <div class="left-container">

        <!-- Selection Heading -->
        <div class="selection-heading">
            <div class="heading-group"> 
                <input type="checkbox" id="select-all"/>
                <label off="select-all">Select All</label>
            </div>
            <div style="display:flex; justify-content: space-between;">
                <span class="icon-trash">🗑️</span>
                <span>Delete All</span>
            </div>
        </div>

        <!-- Items List -->
        <div class="selection-list">

            <!-- Rendered forEach -->
            <div class="selection-item">
                <div class="item-main">
                    <input type="checkbox" class="item-check">
                    <span class="item-name">Chicken Burger</span>
                </div>
                <div class="item-details">
                    <span class="item-price">Rs. 280.00</span>
                    <div class="item-actions">
                        <span class="icon-heart">♡</span>
                        <span class="icon-trash">🗑️</span>
                    </div>
                </div>
                <div class="quantity-control">
                    <button>-</button>
                    <span class="qty">1</span>
                    <button>+</button>
                </div>
            </div>

            <div class="selection-item">
                <div class="item-main">
                    <input type="checkbox" class="item-check">
                    <span class="item-name">Chicken Burger</span>
                </div>
                <div class="item-details">
                    <span class="item-price">Rs. 280.00</span>
                    <div class="item-actions">
                        <span class="icon-heart">♡</span>
                        <span class="icon-trash">🗑️</span>
                    </div>
                </div>
                <div class="quantity-control">
                    <button>-</button>
                    <span class="qty">1</span>
                    <button>+</button>
                </div>
            </div>

            <div class="selection-item">
                <div class="item-main">
                    <input type="checkbox" class="item-check">
                    <span class="item-name">Chicken Burger</span>
                </div>
                <div class="item-details">
                    <span class="item-price">Rs. 280.00</span>
                    <div class="item-actions">
                        <span class="icon-heart">♡</span>
                        <span class="icon-trash">🗑️</span>
                    </div>
                </div>
                <div class="quantity-control">
                    <button>-</button>
                    <span class="qty">1</span>
                    <button>+</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Order Summary -->
    <div class="right-container">
        <!-- Details -->
         <h3>Order Summary</h3>
        <div class="summary-row">
            <span>SUB TOTAL</span>
            <span>430</span>
        </div>
        <div class="summary-row">
            <span>VAT</span>
            <span class="muted">Included in price</span>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-row grand-total">
            <span>GRAND TOTAL</span>
            <span class="total-price">430</span>
        </div>
        <!-- Button -->
        <button class="checkout-btn">Proceed To Checkout</button>
    </div>
</div>

</body>

</html>
